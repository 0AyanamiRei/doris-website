<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"><style>text{font-family:Inter,&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-size:17px;font-weight:700;fill:#1e293b}.subtitle{font-size:11px;fill:#94a3b8}.label{font-size:13px;font-weight:600;fill:#334155}.value{font-size:13px;font-weight:700}.footer,.grid-label{font-size:10px;fill:#94a3b8}.footer{font-style:italic}.grid-line{stroke:#e2e8f0;stroke-width:1;stroke-dasharray:4,3}.axis-line{stroke:#cbd5e1;stroke-width:1.5}</style><rect width="880" height="290" fill="#fff"/><text x="440" y="28" class="title" text-anchor="middle">Wide-Column Single-Path Extraction: Query Time</text><text x="440" y="46" class="subtitle" text-anchor="middle">200K rows × 10K paths · extracting key5000 · 16 CPUs · median of 3 runs</text><line x1="200" x2="200" y1="62" y2="258" class="grid-line"/><text x="200" y="58" class="grid-label" text-anchor="middle">0</text><line x1="298" x2="298" y1="62" y2="258" class="grid-line"/><text x="298" y="58" class="grid-label" text-anchor="middle">1 s</text><line x1="397" x2="397" y1="62" y2="258" class="grid-line"/><text x="397" y="58" class="grid-label" text-anchor="middle">2 s</text><line x1="495" x2="495" y1="62" y2="258" class="grid-line"/><text x="495" y="58" class="grid-label" text-anchor="middle">3 s</text><line x1="594" x2="594" y1="62" y2="258" class="grid-line"/><text x="594" y="58" class="grid-label" text-anchor="middle">4 s</text><line x1="692" x2="692" y1="62" y2="258" class="grid-line"/><text x="692" y="58" class="grid-label" text-anchor="middle">5 s</text><line x1="790" x2="790" y1="62" y2="258" class="grid-line"/><text x="790" y="58" class="grid-label" text-anchor="middle">6 s</text><line x1="200" x2="810" y1="258" y2="258" class="axis-line"/><text x="195" y="93" class="label" text-anchor="end">VARIANT Default</text><rect width="8" height="36" x="200" y="76" fill="#10B981" rx="5"/><text x="214" y="99" fill="#10B981" class="value">76 ms